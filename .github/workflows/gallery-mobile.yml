name: Gallery mobile
on:
  pull_request:
    branches: [gallery-main]
    paths: ['mobile/**', 'open-api/**', 'i18n/**', 'scripts/gallery-review/mobile-check.sh', '.github/workflows/gallery-mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gallery-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Flutter and OpenAPI generator
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/gallery-bin"
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/openapitools/openapi-generator-cli/7.25.0/openapi-generator-cli-7.25.0.jar -o "$RUNNER_TEMP/openapi-generator.jar"
          echo "41ce4f6b07f196676439d710759fa1ced7a08066d06ff1bf314681470289efae  $RUNNER_TEMP/openapi-generator.jar" | sha256sum --check
          printf '#!/usr/bin/env bash\nexec java -jar "%s/openapi-generator.jar" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/gallery-bin/openapi-generator-cli"
          chmod +x "$RUNNER_TEMP/gallery-bin/openapi-generator-cli"
          echo "$RUNNER_TEMP/gallery-bin" >> "$GITHUB_PATH"
      - name: Generate, check, test and build
        run: bash scripts/gallery-review/mobile-check.sh --bootstrap --test-release
      - name: Retain optimized test APK and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gallery-review-android-test-release
          path: .gallery-review/mobile/
          include-hidden-files: true
