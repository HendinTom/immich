# Disposable synthetic environment. Never mount homelab data here.
name: gallery-review-lab
services:
  immich-server:
    image: ${GALLERY_SERVER_IMAGE:-ghcr.io/immich-app/immich-server:v3.3.6}
    platform: ${GALLERY_PLATFORM:-linux/arm64}
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: ${GALLERY_DB_PASSWORD:?Run lab.py up first}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
    ports:
      - '127.0.0.1:22840:2283'
    volumes:
      - media:/data
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: false
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${GALLERY_DB_PASSWORD:?Run lab.py up first}
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - database:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d immich']
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  database:
  media:
